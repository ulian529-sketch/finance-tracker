<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Icon Generator</title>
</head>
<body>
    <canvas id="canvas192" width="192" height="192"></canvas>
    <canvas id="canvas512" width="512" height="512"></canvas>

    <script>
        const svgString = `<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="512" height="512" rx="128" fill="#0F172A"/>
          <path d="M256 128C256 128 320 160 320 224C320 288 256 320 256 320C256 320 192 288 192 224C192 160 256 128 256 128Z" fill="#22D3EE"/>
          <circle cx="256" cy="224" r="48" fill="#0F172A"/>
          <path d="M180 280C180 280 220 300 256 300C292 300 332 280 332 280L332 360C332 372 323 384 312 384L200 384C189 384 180 372 180 360L180 280Z" fill="#F97316"/>
          <rect x="220" y="320" width="72" height="8" rx="4" fill="#0F172A"/>
          <rect x="220" y="340" width="56" height="8" rx="4" fill="#0F172A"/>
        </svg>`;

        function generateIcon(size) {
            const canvas = document.getElementById('canvas' + size);
            const ctx = canvas.getContext('2d');
            const img = new Image();

            img.onload = function() {
                ctx.drawImage(img, 0, 0, size, size);

                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'icon-' + size + '.png';
                    a.click();
                }, 'image/png');
            };

            img.src = 'data:image/svg+xml;base64,' + btoa(svgString);
        }

        generateIcon(192);
        setTimeout(() => generateIcon(512), 500);
    </script>
</body>
</html>
