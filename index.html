<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0F172A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Финансы</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
</head>
<body>
    <div class="app">
        <!-- Tab: Home -->
        <div class="tab-content active" id="tabHome">
            <header class="header">
                <div class="balance-card">
                    <div class="balance-label">Баланс</div>
                    <div class="balance-amount" id="balance">0 ₽</div>
                    <div class="balance-stats">
                        <div class="stat">
                            <span class="stat-label">Доходы</span>
                            <span class="stat-value income" id="totalIncome">0 ₽</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Расходы</span>
                            <span class="stat-value expense" id="totalExpense">0 ₽</span>
                        </div>
                    </div>
                </div>
            </header>

            <section class="recent-transactions">
                <h2 class="section-title">Последние операции</h2>
                <div id="recentTransactionsList" class="transactions-list">
                    <!-- Will be populated by JS -->
                </div>
            </section>
        </div>

        <!-- Tab: Analytics -->
        <div class="tab-content" id="tabAnalytics">
            <section class="analytics">
                <h2 class="section-title">Аналитика</h2>

                <div class="analytics-grid">
                    <div class="analytics-card">
                        <div class="analytics-label">Средний расход в день</div>
                        <div class="analytics-value" id="avgPerDay">0 ₽</div>
                    </div>
                    <div class="analytics-card">
                        <div class="analytics-label">Прогноз до конца месяца</div>
                        <div class="analytics-value" id="forecast">0 ₽</div>
                    </div>
                </div>

                <div class="comparison" id="comparison">
                    <!-- Comparison will be populated by JS -->
                </div>

                <div class="top-categories">
                    <h3 class="subsection-title">Топ категорий</h3>
                    <div id="topCategories" class="top-list">
                        <!-- Will be populated by JS -->
                    </div>
                </div>

                <div class="top-expenses">
                    <h3 class="subsection-title">Топ трат</h3>
                    <div id="topExpenses" class="top-list">
                        <!-- Will be populated by JS -->
                    </div>
                </div>
            </section>
        </div>

        <!-- Tab: History -->
        <div class="tab-content" id="tabHistory">
            <section class="transactions">
                <h2 class="section-title">История</h2>
                <div id="transactionsList" class="transactions-list">
                    <!-- Will be populated by JS -->
                </div>
            </section>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-btn active" data-tab="tabHome">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span class="nav-label">Главная</span>
            </button>

            <button class="nav-btn" data-tab="tabAnalytics">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path>
                    <path d="M22 12A10 10 0 0 0 12 2v10z"></path>
                </svg>
                <span class="nav-label">Аналитика</span>
            </button>

            <button class="nav-btn-add" id="navAddBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>

            <button class="nav-btn" data-tab="tabHistory">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span class="nav-label">История</span>
            </button>

            <button class="nav-btn" id="navMoreBtn">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="1"></circle>
                    <circle cx="12" cy="5" r="1"></circle>
                    <circle cx="12" cy="19" r="1"></circle>
                </svg>
                <span class="nav-label">Ещё</span>
            </button>
        </nav>
    </div>

    <!-- Add transaction modal -->
    <div class="modal" id="addModal">
        <div class="modal-content modal-add">
            <h3 class="modal-title">Добавить операцию</h3>

            <div class="amount-input-wrapper">
                <input type="number" id="amountInput" class="amount-input" placeholder="0" inputmode="decimal">
                <span class="currency">₽</span>
            </div>

            <div class="type-toggle">
                <button class="type-btn active" data-type="expense">Расход</button>
                <button class="type-btn" data-type="income">Доход</button>
            </div>

            <div class="categories" id="categories">
                <!-- Categories will be populated by JS -->
            </div>

            <div class="modal-actions-add">
                <button class="modal-btn cancel-btn" id="addCancelBtn">Отмена</button>
                <button class="add-btn" id="addBtn">Добавить</button>
            </div>
        </div>
    </div>

    <!-- Edit modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <h3 class="modal-title">Редактировать</h3>
            <input type="number" id="editAmount" class="modal-input" placeholder="Сумма">
            <input type="text" id="editCategory" class="modal-input" placeholder="Категория">
            <div class="modal-actions">
                <button class="modal-btn delete-btn" id="deleteBtn">Удалить</button>
                <button class="modal-btn cancel-btn" id="cancelBtn">Отмена</button>
                <button class="modal-btn save-btn" id="saveBtn">Сохранить</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/finance-tracker/service-worker.js', {
                scope: '/finance-tracker/'
            });
        }
    </script>
</body>
</html>
